[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-reconcile"
version = "0.5.0"
description = "A local, traceable reconciliation workbench"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.10,<6.11", "openpyxl>=3.1.3,<3.2", "defusedxml>=0.7.1,<1"]

[project.scripts]
local-reconcile = "local_reconcile.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_reconcile = ["resources/*.csv", "ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
