name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify source
        shell: pwsh
        run: ./scripts/verify.ps1 -PythonPath (Get-Command python).Source -OutputRoot D:\Codex\local-reconcile\ci-run
